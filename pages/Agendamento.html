<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Luís</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src="./agendamento.js"></script>

    <style>
        :root {
            --white: #FFFFFF;
            --black: #000000;
            --lightest-gray: #F9FAFB;
            --dark-gray: #4A5565;
            --light-gray: #D3D3D3;
            --burnt-orange: #D98943;
            --cofee-brown: #40200E;
            --nut-brown: #73462C;
            --rust-brown: #A66B49;
            --dark-redish-brown: #260F06;
        }

        body {
            background-image: url(../imagens/vintage-frame-salon-tools-wooden-table-jobs-career-concept_53876-143259.avif);
        }

        .logo {
            /*display: flex;
            justify-content: end;*/
            height: 5rem;
            padding-right: 0;
            margin-left: 6.375rem;
        }

        nav {
            background-color: var(--white);
            border-bottom: 1px solid black;
        }
        
       form {
        margin-top: 3rem;
        margin-left: 29.5%;
        border: 1px solid var(--dark-gray);
        width: 40rem;
        height: 30rem;
        background-color: var(--white);
       }

       .p1 {
        margin-top: 1rem;
       }

       .p3 {
        margin-bottom: 1rem;
        font-style: italic;
        color: var(--light-gray);
        font-weight: 600;
       }

       .input {
        width: 32rem;
       }

       .input2 {
        width: 5rem;
        padding-left: 14px;
        margin-bottom: 1rem;
       }

       .input3 {
        width: 5rem;
       }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../imagens/barbearia-logo.avif" alt="logo" width="80" class="me-2">
                <div>
                    <strong class="fs-4">Barbearia do Seu Luís</strong><br>
                    <small>20 anos de tradição</small>
                </div>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="menu">
              <ul class="navbar-nav align-items-center">
                <li class="nav-item fs-5"><a class="nav-link" href="../index.html">Início</a></li>
                <li class="nav-item fs-5"><a class="nav-link" href="./Sobre.html">Sobre</a></li>
                <li class="nav-item fs-5"><a class="nav-link" href="./Serviços.html">Serviços</a></li>
                <li class="nav-item fs-5"><a class="nav-link" href="./Portifólio.html">Portfólio</a></li>
                <li class="nav-item fs-5"><a class="nav-link" href="./Depoimentos.html">Depoimentos</a></li>

                <li class="nav-item ms-3">
                  <a class="btn btn-dark rounded px-4 fs-5" href="#">Agendar</a>
                </li>
              </ul>
            </div>

        </div>
    </nav>

    <form name="agendaMento" onsubmit="validarFormulario(event)" class="d-flex align-items-center justify-content center flex-column row-gap-1">
        <p class="p1">Digite seu nome completo</p>
        <input type="text" name="nome" placeholder="Teresa de Maria" class="input">
        <p>Digite seu telefone</p>
        <input type="tel" name="telefone" placeholder="(99) 99999-9999" class="input">
        <p>Serviço</p>
        <input type="text" name="serviço" placeholder="Pintar o Cabelo" class="input">
        <p>Data</p>
        <input type="date" name="data" placeholder="99/99/9999" class="input">
        <p>Horário Preferido do cliente</p>
        <div class="d-flex flex-row column-gap-3 align-items-center">            
            <input type="time" name="hora" class="input2">
            <p class="p3">*Horário de funcionamento: 9-12, 13-18</p>
        </div>

        <input type="submit" value="Enviar" class="input3">
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
